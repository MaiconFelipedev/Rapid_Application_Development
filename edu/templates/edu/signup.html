{% extends 'edu/base.html' %}

{% block content %}
<h2>Cadastro</h2>

<form method="post" novalidate>
    {% csrf_token %}
    {% for field in form %}
        <div class="form-row">
            {{ field.label_tag }}
            {{ field }}
            {% if field.errors %}
                <div class="error">{{ field.errors }}</div>
            {% endif %}
        </div>
    {% endfor %}
    
    <div class="form-actions">
        <button type="submit" class="btn btn-success">Cadastrar</button>
    </div>

</form>

<p class="mt-3">
    Já tem conta? <a href="{% url 'signin' %}">Entrar</a>
</p>

{% endblock %}
